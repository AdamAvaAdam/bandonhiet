<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Điều phối V12.6 - Fix Tag & Delete</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        :root { --primary: #ff1744; --dark: #2d3436; --bg: #f8f9fa; --teal: #00b894; --gray: #b2bec3; }
        body, html { margin: 0; padding: 0; height: 100%; width: 100%; font-family: 'Segoe UI', sans-serif; overflow: hidden; }
        
        /* LOGIN */
        #login-overlay { position: fixed; inset: 0; background: var(--dark); display: flex; align-items: center; justify-content: center; z-index: 10000; }
        .login-box { background: #fff; padding: 30px; border-radius: 20px; width: 85%; max-width: 350px; text-align: center; border-bottom: 5px solid var(--primary); }
        .login-box h2 { color: var(--primary); margin-bottom: 20px; }
        .login-box input { width: 100%; padding: 12px; margin-bottom: 15px; border-radius: 10px; border: 1px solid #ddd; font-size: 16px; box-sizing: border-box; }
        .login-box button { width: 100%; padding: 14px; background: var(--primary); color: white; border: none; border-radius: 10px; font-weight: bold; cursor: pointer; }

        /* APP */
        #main-app { display: none; height: 100vh; width: 100vw; flex-direction: column; position: relative; }
        #map { position: absolute; top: 0; left: 0; right: 0; bottom: 0; z-index: 1; background: #fdfdfd; }
        
        #sidebar { 
            position: absolute; bottom: 0; left: 0; width: 100%; max-height: 60%; 
            background: #fff; z-index: 1000; padding: 15px; box-sizing: border-box; 
            border-top: 4px solid var(--primary); transition: transform 0.4s;
            overflow-y: auto; box-shadow: 0 -5px 25px rgba(0,0,0,0.2);
        }
        #sidebar.hidden { transform: translateY(105%); }

        #floating-toggle {
            position: fixed; bottom: 20px; right: 20px; z-index: 2000;
            background: var(--dark); color: white; border: 2px solid var(--primary); width: 55px; height: 55px;
            border-radius: 50%; font-weight: bold; cursor: pointer; display: flex; align-items: center; justify-content: center;
            font-size: 20px;
        }

        @media (min-width: 768px) {
            #sidebar { top: 0; left: 0; bottom: 0; width: 400px; max-height: 100%; border-top: none; border-right: 4px solid var(--primary); transform: none !important; }
            #sidebar.hidden { transform: translateX(-105%) !important; }
            #floating-toggle { bottom: 25px; left: 375px; right: auto; }
            #sidebar.hidden ~ #floating-toggle { left: 20px; }
        }

        .card { background: #fffaf0; border-radius: 12px; padding: 12px; margin-bottom: 12px; border: 1px solid #f3e5ab; }
        .card-title { font-weight: 800; color: var(--primary); margin-bottom: 8px; font-size: 11px; text-transform: uppercase; }
        input, select, button.action-btn { width: 100%; padding: 12px; margin-top: 8px; border-radius: 8px; border: 1px solid #ced4da; font-size: 14px; box-sizing: border-box; }
        
        .stats-box { background: #ffffff; padding: 10px; border-radius: 12px; margin-top: 10px; border-left: 6px solid var(--primary); box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .dealer-table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 11px; display: none; }
        .dealer-table th { text-align: left; border-bottom: 1px solid #eee; padding: 5px; color: #666; }
        .dealer-table td { padding: 8px 5px; border-top: 1px solid #f9f9f9; }
        
        /* FIX TAG KHO: Đảm bảo nền bao hết chữ */
        .wh-label { 
            display: inline-block;
            white-space: nowrap;
            padding: 4px 10px;
            border-radius: 6px;
            color: white;
            font-size: 12px;
            font-weight: bold;
            border: 2px solid white;
            box-shadow: 0 2px 6px rgba(0,0,0,0.4);
            transform: translate(-50%, -140%);
        }
    </style>
</head>
<body>

<div id="login-overlay">
    <div class="login-box">
        <h2>ĐĂNG NHẬP V12.6</h2>
        <input type="text" id="username" placeholder="User" value="admin">
        <input type="password" id="password" placeholder="Pass" value="HA5566">
        <button onclick="checkLogin()">KÍCH HOẠT</button>
        <p id="error-text" style="color: red; font-size: 12px; display: none; margin-top: 10px;">Sai tài khoản hoặc mật khẩu!</p>
    </div>
</div>

<div id="main-app">
    <div id="map"></div>
    <button id="floating-toggle" onclick="toggleSidebar()">☰</button>

    <div id="sidebar">
        <div class="card">
            <div class="card-title">🔍 PHÂN TÍCH KHU VỰC</div>
            <input type="text" id="areaSearchInput" placeholder="Vd: Hà Nội" onkeypress="if(event.key==='Enter') searchArea()">
            <button class="action-btn" style="background:var(--dark); color:white;" onclick="searchArea()">SOI VIỀN</button>
        </div>
        
        <div class="card">
            <div class="card-title">📍 CÀI ĐẶT ĐIỀU PHỐI (KM)</div>
            <div style="display:grid; grid-template-columns: 1fr 1fr; gap: 8px;">
                <select id="pinToggle"><option value="off">XEM</option><option value="on">CẮM KHO</option></select>
                <input type="number" id="radiusInput" value="3" step="0.5" oninput="updateAllRadius()">
            </div>
            <p style="font-size: 10px; color: #d63031; margin-top: 8px; font-weight: bold;">* Click đúp vào kho để chỉnh bán kính.<br>* Nút [Xóa] nằm trong bảng danh sách phía dưới.</p>
        </div>

        <div id="warehouse-list"></div>
        
        <div class="card" style="background: #f1f5f9; border: none;">
            <button class="action-btn" style="background:var(--teal); color:white; border:none; font-weight:bold;" onclick="loadDataOnline()">LÀM MỚI DỮ LIỆU</button>
            <button class="action-btn" style="background:#fff; color:var(--dark); font-weight:bold;" onclick="logout()">ĐĂNG XUẤT</button>
        </div>
    </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet.heat@0.2.0/dist/leaflet-heat.js"></script>

<script>
    // --- 1. DỮ LIỆU KHO CỐ ĐỊNH ---
    const COMPANY_WAREHOUSES = [
        { name: 'Kho Hải Dương', lat: 20.935218, lng: 106.263725 },
        { name: 'Kho hàng Bồ Đề', lat: 21.032984, lng: 105.868785 },
        { name: 'Kho Nam Định', lat: 20.388619, lng: 106.181112 },
        { name: 'Kho Nghệ An', lat: 18.669113, lng: 105.619930 },
        { name: 'Kho Phú Thọ', lat: 21.337913, lng: 105.371026 },
        { name: 'Kho Thanh Hóa', lat: 19.841778, lng: 105.803065 },
        { name: 'Kho Xuân Mai', lat: 20.927063, lng: 105.596998 },
        { name: 'Kho Ninh Bình', lat: 20.327513, lng: 105.729169 },
        { name: 'Kho Thái Bình', lat: 20.479458, lng: 106.294279 },
        { name: 'Kho Hưng Yên', lat: 20.76934, lng: 106.051002 }
    ];

    // --- 2. QUẢN LÝ ĐĂNG NHẬP ---
    function checkLogin() {
        const u = document.getElementById('username').value, p = document.getElementById('password').value;
        if (u === 'admin' && p === 'HA5566') { localStorage.setItem('isLogged', 'true'); enterApp(); }
        else { document.getElementById('error-text').style.display = 'block'; }
    }
    function logout() { if(confirm("Đăng xuất?")) { localStorage.removeItem('isLogged'); location.reload(); } }
    window.onload = function() { if (localStorage.getItem('isLogged') === 'true') enterApp(); };

    function enterApp() {
        document.getElementById('login-overlay').style.display = 'none';
        document.getElementById('main-app').style.display = 'flex';
        setTimeout(() => { map.invalidateSize(); }, 400);
        loadDataOnline();
        initSystemWarehouses();
        loadSavedWarehouses();
    }

    // --- 3. KHỞI TẠO MAP ---
    const map = L.map('map', { zoomSnap: 0.1, zoomControl: false }).setView([20.8, 106.0], 9);
    L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png').addTo(map);

    let dealers = [], warehouses = [], highlightLayer = L.layerGroup().addTo(map), 
        heatLayerGroup = L.layerGroup().addTo(map), dealerLayer = L.layerGroup().addTo(map), heatLayer = null;

    function getRankColor(ds) {
        if (ds <= 0) return '#b2bec3';          
        if (ds < 500000000) return '#00b894';    
        if (ds < 1000000000) return '#a29bfe';   
        if (ds < 2000000000) return '#fdcb6e';   
        return '#ff1744';                       
    }

    async function loadDataOnline() {
        const url = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSqx48yei68qBJFSiHZzxCeGO0df4IDE6md9hzu7TUv5GjgOvU9yIpm4lEN6HJw9zJuek4YYMj8XAyn/pub?gid=0&single=true&output=csv";
        try {
            const r = await fetch(url); const t = await r.text();
            const rows = t.split(/\r?\n/).slice(1);
            dealers = []; dealerLayer.clearLayers(); 
            let hp = [];

            rows.forEach(line => {
                const col = line.split(/,|\t/); if (col.length < 6) return;
                let ds = parseFloat(col[5].toString().replace(/\./g, '').replace(/,/g, '')) || 0;
                let lat = parseFloat(col[4].toString().replace(',', '.')), lng = parseFloat(col[3].toString().replace(',', '.'));
                
                if (!isNaN(lat) && !isNaN(lng)) {
                    const color = getRankColor(ds);
                    const m = L.circleMarker([lat, lng], { radius: ds > 0 ? 4 : 2.5, color: color, weight: 1, fillOpacity: 0.8, fillColor: color });
                    m.bindTooltip(`<b>${col[1]}</b><br>DS: ${ds.toLocaleString()}đ`, { sticky: true });
                    dealers.push({ latlng: L.latLng(lat, lng), ds, ten: col[1], lat, lng });
                    m.addTo(dealerLayer);
                    if (ds > 0) hp.push([lat, lng, Math.min(ds / 1000000000, 1)]);
                }
            });
            if (heatLayer) heatLayerGroup.removeLayer(heatLayer);
            heatLayer = L.heatLayer(hp, { radius: 25, blur: 15, max: 0.7 }).addTo(heatLayerGroup);
            updateStats();
        } catch (e) { console.error("Sync error"); }
    }

    // --- 4. XỬ LÝ KHO ---
    function initSystemWarehouses() {
        const r = parseFloat(document.getElementById('radiusInput').value) || 3;
        COMPANY_WAREHOUSES.forEach(w => addWarehouse(L.latLng(w.lat, w.lng), r, w.name, true));
    }

    map.on('click', e => {
        if (document.getElementById('pinToggle').value === 'on') {
            addWarehouse(e.latlng, parseFloat(document.getElementById('radiusInput').value) || 3, "Kho cắm " + (warehouses.length + 1), false);
        }
    });

    function addWarehouse(latlng, radiusKm, name, isCompany = false) {
        const id = isCompany ? name : ("wh-" + Date.now() + Math.random());
        const rM = radiusKm * 1000;
        
        // FIX: Thêm class wh-label để bao hết chữ
        const m = L.marker(latlng, { 
            draggable: true,
            icon: L.divIcon({
                className: '',
                html: `<div class="wh-label" style="background:${isCompany ? '#2d3436' : '#d63031'};">${name}</div>`,
                iconSize: null
            })
        }).addTo(map);

        const c = L.circle(latlng, { radius: rM, color: isCompany ? '#2d3436' : '#ff1744', weight: 2, fillOpacity: 0.05 }).addTo(map);
        const wh = { id, marker: m, circle: c, latlng, radius: rM, name, isCompany };
        
        m.on('dblclick', (ev) => {
            L.DomEvent.stopPropagation(ev);
            const newR = prompt(`Bán kính mới cho ${name} (KM):`, wh.radius/1000);
            if(newR && !isNaN(newR)) { wh.radius = parseFloat(newR) * 1000; c.setRadius(wh.radius); updateStats(); if(!isCompany) saveWarehouses(); }
        });
        m.on('dragend', () => { wh.latlng = m.getLatLng(); c.setLatLng(wh.latlng); updateStats(); if(!isCompany) saveWarehouses(); });

        warehouses.push(wh); 
        updateStats();
    }

    function removeWarehouse(id) {
        if(confirm("Xác nhận xóa kho này?")) {
            const wh = warehouses.find(w => w.id === id);
            if(wh) {
                map.removeLayer(wh.marker); map.removeLayer(wh.circle);
                warehouses = warehouses.filter(w => w.id !== id);
                updateStats(); saveWarehouses();
            }
        }
    }

    // --- 5. HIỂN THỊ SIDEBAR ---
    function updateStats() {
        const container = document.getElementById('warehouse-list');
        container.innerHTML = '<strong style="color:var(--dark); font-size:11px; margin:10px 0; display:block;">DỮ LIỆU ĐIỀU PHỐI:</strong>';
        warehouses.forEach(w => {
            const inR = dealers.filter(d => w.latlng.distanceTo(d.latlng) <= w.radius).sort((a,b) => b.ds - a.ds);
            const sumDS = inR.reduce((a, b) => a + b.ds, 0);
            let rows = inR.map(d => `<tr><td>${d.ten}</td><td style="color:var(--primary); font-weight:bold;">${sumDS > 0 ? ((d.ds/sumDS)*100).toFixed(1) : 0}%</td><td class="dist-cell" data-lat="${d.lat}" data-lng="${d.lng}">...</td></tr>`).join('');
            
            const deleteBtn = !w.isCompany ? `<button onclick="removeWarehouse('${w.id}')" style="background:#ff1744; color:white; border:none; padding:3px 8px; border-radius:4px; font-size:9px; cursor:pointer; margin-right:10px;">XÓA</button>` : '';

            container.innerHTML += `<div class="stats-box" style="border-left-color: ${w.isCompany ? '#2d3436' : '#ff1744'}">
                <div style="display:flex; justify-content:space-between; align-items:center;">
                    <span style="font-weight:800; font-size:13px;">${w.name} (${w.radius/1000}km)</span>
                    <div style="display:flex; align-items:center;">
                        ${deleteBtn}
                        <span style="cursor:pointer; color:var(--primary); font-size:22px;" onclick="toggleTable('${w.id}')">▾</span>
                    </div>
                </div>
                <div style="font-size:11px; margin-top:5px;">Doanh số: <b style="color:#d63031">${sumDS.toLocaleString()}đ</b></div>
                <table class="dealer-table" id="tbl-${w.id}"><thead><tr><th>Khách</th><th>Tỷ trọng</th><th>Km</th></tr></thead><tbody>${rows || '<tr><td colspan="3">Trống</td></tr>'}</tbody></table>
            </div>`;
        });
    }

    async function toggleTable(id) {
        const tbl = document.getElementById(`tbl-${id}`);
        tbl.style.display = (tbl.style.display === "table") ? "none" : "table";
        if (tbl.style.display === "table") {
            const wh = warehouses.find(w => w.id == id);
            const cells = tbl.querySelectorAll('.dist-cell');
            for (let cell of cells) if (cell.innerText === "...") {
                const r = await fetch(`https://router.project-osrm.org/route/v1/driving/${wh.latlng.lng},${wh.latlng.lat};${cell.dataset.lng},${cell.dataset.lat}?overview=false`);
                const d = await r.json(); cell.innerText = d.code === 'Ok' ? (d.routes[0].distance / 1000).toFixed(1) + "km" : "N/A";
            }
        }
    }

    // --- UTILS ---
    function saveWarehouses() {
        const data = warehouses.filter(w => !w.isCompany).map(w => ({ lat: w.latlng.lat, lng: w.latlng.lng, radius: w.radius/1000, name: w.name }));
        localStorage.setItem('savedWarehouses', JSON.stringify(data));
    }
    function loadSavedWarehouses() {
        const data = JSON.parse(localStorage.getItem('savedWarehouses') || "[]");
        data.forEach(d => addWarehouse(L.latLng(d.lat, d.lng), d.radius, d.name, false));
    }
    function updateAllRadius() {
        const rKm = parseFloat(document.getElementById('radiusInput').value) || 3;
        warehouses.forEach(w => { w.radius = rKm * 1000; w.circle.setRadius(rKm * 1000); });
        updateStats(); saveWarehouses();
    }
    async function searchArea() {
        const input = document.getElementById('areaSearchInput').value; if (!input) return;
        const resp = await fetch(`https://nominatim.openstreetmap.org/search?q=${encodeURIComponent(input + ", Vietnam")}&format=json&polygon_geojson=1&limit=1`);
        const data = await resp.json();
        if (data.length > 0) { 
            highlightLayer.clearLayers(); 
            L.geoJSON(data[0].geojson, { style: { color: '#ff1744', weight: 3, fillOpacity: 0 } }).addTo(highlightLayer); 
            map.fitBounds(L.geoJSON(data[0].geojson).getBounds(), { padding: [30,30] }); 
        }
    }
    function toggleSidebar() {
        const sb = document.getElementById('sidebar'), btn = document.getElementById('floating-toggle');
        sb.classList.toggle('hidden'); btn.innerText = sb.classList.contains('hidden') ? "☰" : "✖";
    }
</script>
</body>
</html>
